<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MyEagle ID Demo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(rgba(0, 15, 45, 0.45), rgba(0, 15, 45, 0.45)),
        #d9d9d9;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding-top: 12px;
    }

    .modal {
      position: relative;

      width: 400px;

      background: white;

      border-radius: 5px;

      box-shadow:
        0 2px 5px rgba(0, 0, 0, 0.35);

      overflow: hidden;
    }

    .header {
      position: relative;

      height: 78px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-bottom: 1px solid #dddddd;
    }

    .header h1 {
      margin: 0;

      color: #001747;

      font-size: 22px;
      font-style: italic;
      font-weight: 700;
    }

    .close {
      position: absolute;

      top: 10px;
      right: 19px;

      color: #777777;

      font-size: 29px;
      font-weight: bold;

      line-height: 1;
    }

    .content {
      text-align: center;

      padding-top: 20px;
    }

    .photo-container {
      width: 268px;
      height: 268px;

      margin: 0 auto;

      border-radius: 10px;

      overflow: hidden;

      background: #f5f5f7;
    }

    .photo-container img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center 35%;
    }

    .name {
      margin-top: 18px;

      color: #001747;

      font-size: 22px;
      font-weight: 400;
    }

    .eagle-id {
      margin-top: 16px;
      margin-bottom: 20px;

      color: #001747;

      font-size: 23px;
      font-weight: 400;
    }

    .divider {
      width: 100%;
      height: 1px;

      background: #dddddd;
    }

    .barcode-area {
      padding-top: 21px;

      text-align: center;
    }

    /*
      Decorative only.
      This is NOT an encoded or functional barcode.
    */

    .fake-barcode {
      width: 200px;
      height: 45px;

      margin: 0 auto;

      background:
        repeating-linear-gradient(
          90deg,
          #111 0px,
          #111 2px,
          white 2px,
          white 4px,
          #111 4px,
          #111 5px,
          white 5px,
          white 8px,
          #111 8px,
          #111 11px,
          white 11px,
          white 13px
        );
    }

    .notice {
      padding:
        13px
        15px
        7px;

      color: #111111;

      font-size: 11px;
      line-height: 14px;

      text-align: center;
    }

    .demo-label {
      padding-bottom: 10px;

      color: #a00000;

      font-size: 11px;
      font-weight: bold;

      letter-spacing: 1px;

      text-align: center;
    }
  </style>
</head>

<body>

  <div class="modal">

    <div class="header">

      <h1>MyEagle ID</h1>

      <div class="close">
        &times;
      </div>

    </div>


    <div class="content">

      <div class="photo-container">

        <img
          src="christian.png"
          alt="Profile photo"
        >

      </div>


      <div class="name">
        Christian Poventud
      </div>


      <div class="eagle-id">
        901434976
      </div>

    </div>


    <div class="divider"></div>


    <div class="barcode-area">

      <div class="fake-barcode"></div>

    </div>


    <div class="notice">
      Demo recreation for an HTML project.
      This mockup is not an official Eagle Card or university credential.
    </div>

    <div class="demo-label">
      SAMPLE / DEMO
    </div>

  </div>

</body>
</html>
